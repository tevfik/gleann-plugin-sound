name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev

      - name: Test
        run: go test -race -count=1 -timeout 60s ./...

  # ── Stub build (all platforms, no whisper.cpp / no ONNX) ──
  # Requires CGO for robotgo (keyboard injection) and malgo (audio capture).
  release-stub:
    name: Stub (${{ matrix.os-label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            os-label: linux-amd64
            ext: ""
            archive: tar.gz
            generate_notes: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            os-label: linux-arm64
            ext: ""
            archive: tar.gz
            generate_notes: false
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            os-label: darwin-arm64
            ext: ""
            archive: tar.gz
          - runner: windows-2022
            goos: windows
            goarch: amd64
            os-label: windows-amd64
            ext: ".exe"
            archive: zip
            generate_notes: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install system dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build gleann-plugin-sound (stub)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          BINARY="gleann-plugin-sound-stub-${{ steps.version.outputs.version }}-${{ matrix.os-label }}${{ matrix.ext }}"
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }}"
          go build -trimpath -ldflags "$LDFLAGS" -o "$BINARY" ./cmd/gleann-plugin-sound/

      - name: Compress binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar czf "dist/gleann-plugin-sound-stub-${{ steps.version.outputs.version }}-${{ matrix.os-label }}.tar.gz" \
            gleann-plugin-sound-stub-${{ steps.version.outputs.version }}-${{ matrix.os-label }}

      - name: Compress binary (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          7z a "dist/gleann-plugin-sound-stub-${{ steps.version.outputs.version }}-${{ matrix.os-label }}.zip" \
            "gleann-plugin-sound-stub-${{ steps.version.outputs.version }}-${{ matrix.os-label }}${{ matrix.ext }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: ${{ matrix.generate_notes }}

  # ── Whisper.cpp build (all platforms, CGO required) ──
  release-whisper:
    name: Whisper (${{ matrix.os-label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            os-label: linux-amd64
            ext: ""
            archive: tar.gz
            cmake-extra: ""
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            os-label: linux-arm64
            ext: ""
            archive: tar.gz
            cmake-extra: "-DGGML_NATIVE=OFF"
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            os-label: darwin-arm64
            ext: ""
            archive: tar.gz
            cmake-extra: "-DGGML_METAL=OFF -DGGML_BLAS=OFF"
          - runner: windows-2022
            goos: windows
            goarch: amd64
            os-label: windows-amd64
            ext: ".exe"
            archive: zip
            cmake-extra: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install system dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev cmake build-essential

      - name: Install system dependencies (macOS)
        if: matrix.goos == 'darwin'
        run: brew install cmake libomp openblas

      - name: Add MinGW to PATH (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build whisper.cpp (CPU-only)
        shell: bash
        run: |
          WHISPER_DIR="$HOME/whisper.cpp"
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_DIR"
          mkdir -p "$WHISPER_DIR/build"
          cd "$WHISPER_DIR/build"
          
          # Windows: Use MinGW to match Go's CGo compiler
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cmake .. \
              -G "MinGW Makefiles" \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$WHISPER_DIR/dist" \
              -DGGML_CUDA=OFF \
              -DGGML_VULKAN=OFF \
              -DGGML_SYCL=OFF \
              -DWHISPER_BUILD_EXAMPLES=OFF \
              -DWHISPER_BUILD_TESTS=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              ${{ matrix.cmake-extra }}
            cmake --build . --config Release --parallel 2
          else
            EXTRA_ARGS=""
            if [ "${{ matrix.goos }}" = "darwin" ]; then
               EXTRA_ARGS="-DOpenMP_ROOT=$(brew --prefix libomp)"
            fi
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$WHISPER_DIR/dist" \
              -DGGML_CUDA=OFF \
              -DGGML_VULKAN=OFF \
              -DGGML_SYCL=OFF \
              -DWHISPER_BUILD_EXAMPLES=OFF \
              -DWHISPER_BUILD_TESTS=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              ${{ matrix.cmake-extra }} ${EXTRA_ARGS}
            cmake --build . --config Release --parallel 2
          fi
          cmake --install . --config Release

          # Windows MinGW build might not prefix static libraries with 'lib'
          if [ "${{ matrix.goos }}" = "windows" ]; then
            for f in "$WHISPER_DIR/dist/lib"/*.a; do
              basename=$(basename "$f")
              if [[ ! "$basename" =~ ^lib ]]; then
                mv "$f" "$WHISPER_DIR/dist/lib/lib$basename"
              fi
            done
          fi

          ls -R "$WHISPER_DIR/dist/lib"

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build gleann-plugin-sound (whisper)
        shell: bash
        run: |
          WHISPER_DIR="$HOME/whisper.cpp"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            WHISPER_DIR=$(cygpath -m "$WHISPER_DIR")
          fi
          
          BINARY="gleann-plugin-sound-${{ steps.version.outputs.version }}-${{ matrix.os-label }}${{ matrix.ext }}"
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }}"

          # Platform-specific linker flags
          if [ "${{ matrix.goos }}" = "linux" ]; then
            EXTRA_LDFLAGS="-lm -lstdc++ -lpthread -lgomp"
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            EXTRA_LDFLAGS="-lm -lc++ -lpthread -framework Accelerate $(brew --prefix libomp)/lib/libomp.a"
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            # Static linking to avoid DLL dependencies.
            # Using -static ensures all MinGW libraries including gomp and stdc++ are statically linked.
            EXTRA_LDFLAGS="-static -lstdc++ -lpthread -lsetupapi -ladvapi32 -lole32 -lshlwapi -lgomp"
          fi

          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$WHISPER_DIR/dist/include" \
          CGO_LDFLAGS="-L$WHISPER_DIR/dist/lib -lwhisper -lggml -lggml-cpu -lggml-base $EXTRA_LDFLAGS" \
          go build -trimpath -tags whisper -ldflags "$LDFLAGS" -o "$BINARY" ./cmd/gleann-plugin-sound/

      - name: Compress binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar czf "dist/gleann-plugin-sound-${{ steps.version.outputs.version }}-${{ matrix.os-label }}.tar.gz" \
            gleann-plugin-sound-${{ steps.version.outputs.version }}-${{ matrix.os-label }}

      - name: Compress binary (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          7z a "dist/gleann-plugin-sound-${{ steps.version.outputs.version }}-${{ matrix.os-label }}.zip" \
            "gleann-plugin-sound-${{ steps.version.outputs.version }}-${{ matrix.os-label }}${{ matrix.ext }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false

  # ── ONNX Runtime build (Linux amd64 + arm64) ──
  release-onnx:
    name: ONNX (linux-${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            ort-arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            ort-arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev

      - name: Install ONNX Runtime
        run: |
          ORT_VERSION="1.22.0"
          curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${{ matrix.ort-arch }}-${ORT_VERSION}.tgz" \
            | sudo tar xz -C /usr/local --strip-components=1
          sudo ldconfig

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build gleann-plugin-sound (onnx)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          BINARY="gleann-plugin-sound-onnx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}"
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }}"
          go build -trimpath -tags onnx -ldflags "$LDFLAGS" -o "$BINARY" ./cmd/gleann-plugin-sound/

      - name: Compress binary
        run: |
          mkdir -p dist
          tar czf "dist/gleann-plugin-sound-onnx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            gleann-plugin-sound-onnx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false

  # ── whisper.cpp + ONNX Runtime build (Linux amd64 + arm64) ──
  # The flavour `make build-all` produces and `gleann-plugin-sound update`
  # installs for it (update never swaps a build for another flavour).
  release-whisper-onnx:
    name: Whisper + ONNX (linux-${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            ort-arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            ort-arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev cmake build-essential

      - name: Install ONNX Runtime
        run: |
          ORT_VERSION="1.22.0"
          curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${{ matrix.ort-arch }}-${ORT_VERSION}.tgz" \
            | sudo tar xz -C /usr/local --strip-components=1
          sudo ldconfig

      - name: Build whisper.cpp (CPU-only)
        run: |
          WHISPER_DIR="$HOME/whisper.cpp"
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_DIR"
          cmake -S "$WHISPER_DIR" -B "$WHISPER_DIR/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$WHISPER_DIR/dist" \
            -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_SYCL=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            $([ "${{ matrix.arch }}" = arm64 ] && echo -DGGML_NATIVE=OFF)
          cmake --build "$WHISPER_DIR/build" --config Release --parallel 2
          cmake --install "$WHISPER_DIR/build" --config Release

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build gleann-plugin-sound (whisper + onnx)
        env:
          CGO_ENABLED: "1"
        run: |
          WHISPER_DIR="$HOME/whisper.cpp"
          BINARY="gleann-plugin-sound-whisper-onnx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}"
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }}"
          CGO_CFLAGS="-I$WHISPER_DIR/dist/include" \
          CGO_LDFLAGS="-L$WHISPER_DIR/dist/lib -lwhisper -lggml -lggml-cpu -lggml-base -lm -lstdc++ -lpthread -lgomp" \
          go build -trimpath -tags "whisper,onnx" -ldflags "$LDFLAGS" -o "$BINARY" ./cmd/gleann-plugin-sound/

      - name: Compress binary
        run: |
          mkdir -p dist
          tar czf "dist/gleann-plugin-sound-whisper-onnx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            gleann-plugin-sound-whisper-onnx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false

  # ── gleann-asr-helper: the sidecar behind the "tc" backend (transcribe.cpp) ──
  # Built natively on each architecture; GGML_NATIVE=OFF keeps the binary
  # runnable on CPUs other than the build runner's.
  release-asr-helper:
    name: ASR helper (linux-${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            cmake-extra: "-DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF"
          - runner: ubuntu-24.04-arm
            arch: arm64
            cmake-extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libopenblas-dev python3-pip

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build gleann-asr-helper
        env:
          GGML_NATIVE: "OFF"
          CMAKE_EXTRA: ${{ matrix.cmake-extra }}
        run: |
          mkdir -p out
          native/asr-helper/build.sh "$PWD/out"
          file out/gleann-asr-helper

      - name: Compress binary
        run: |
          mkdir -p dist
          tar czf "dist/gleann-asr-helper-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" -C out gleann-asr-helper

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false

  # ── checksums.txt: lets `update` verify what it downloads ──
  checksums:
    name: Publish checksums.txt
    needs: [release-stub, release-whisper, release-onnx, release-whisper-onnx, release-asr-helper]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checksum every published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.zip'
          sha256sum * > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
